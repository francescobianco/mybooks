<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login · mybooks</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
<div id="login">
  <h1>mybooks</h1>
  {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
  {{if .Revoked}}<p class="error">Questo link non è più valido: accedi di nuovo.</p>{{end}}
  <form action="/login" method="post">
    <input type="password" name="password" placeholder="Password" autofocus>
    <p class="remember"><label><input type="checkbox" name="remember" value="1"> Ricorda questo dispositivo</label></p>
    <p class="remember-hint">Per browser che dimenticano l'accesso alla chiusura (es. Kobo): riceverai un link personale da salvare come home page.</p>
    <input type="text" name="device" placeholder="Nome dispositivo (es. Kobo)" maxlength="60">
    <button type="submit">Entra</button>
  </form>
</div>
</body>
</html>
